name: Verify course content

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'  # the same version that generated js/data/course.js (error messages differ between versions)
      - name: Run every example, quiz and solution
        run: python3 tools/build.py --check
      - name: Check that js/data/course.js is up to date
        run: |
          python3 tools/build.py
          git diff --exit-code js/data/course.js || (echo "::error::Run 'python3 tools/build.py' and commit js/data/course.js" && exit 1)
